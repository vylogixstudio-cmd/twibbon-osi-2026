<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Twibbon OSI 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#1A2B4C', hover: '#132038' },
                        gold: { DEFAULT: '#E5AA22', hover: '#CA9318' },
                        surface: '#F8FAFC',
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-surface min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-navy text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-gold font-bold text-xl">⚙️ Admin Panel</span>
            <span class="text-sm border-l border-gray-500 pl-3">Twibbon OSI 2026</span>
        </div>
        <button id="logoutBtn" class="hidden text-sm bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition-colors">Logout</button>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Login Section -->
        <div id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg mt-10">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-navy">Login Admin</h2>
                <p class="text-gray-500 text-sm mt-1">Masukkan email dan password Firebase kamu.</p>
            </div>
            <form id="loginForm" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                    <input type="email" id="emailInput" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-gold" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="passwordInput" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-gold" required>
                </div>
                <button type="submit" id="loginBtn" class="mt-2 w-full bg-navy text-white font-semibold py-2.5 rounded-lg hover:bg-navy-hover transition-colors">Login</button>
                <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden flex-col gap-8">
            
            <!-- Pengaturan Template -->
            <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-gold">
                <h3 class="text-xl font-bold text-navy mb-4 flex items-center gap-2">
                    🖼️ Pengaturan Template Twibbon
                </h3>
                <div class="flex flex-col md:flex-row gap-6 items-start">
                    <div class="w-full md:w-1/3">
                        <p class="text-sm font-semibold text-gray-600 mb-2">Template Saat Ini:</p>
                        <div class="bg-gray-100 rounded-lg p-2 border-2 border-dashed border-gray-300">
                            <img id="currentTemplatePreview" src="twibbon.png" class="w-full h-auto object-contain rounded" alt="Current Template">
                        </div>
                    </div>
                    <div class="w-full md:w-2/3">
                        <p class="text-sm text-gray-600 mb-4">Upload file PNG transparan baru untuk mengganti bingkai Twibbon untuk semua pengguna.</p>
                        <input type="file" id="templateUpload" accept="image/png" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-gold hover:file:bg-yellow-100 mb-4">
                        <button id="saveTemplateBtn" class="bg-gold hover:bg-gold-hover text-white font-semibold px-6 py-2 rounded-lg transition-colors disabled:opacity-50">Upload & Simpan Perubahan</button>
                        <p id="templateStatus" class="text-sm mt-2 font-medium"></p>
                    </div>
                </div>
            </div>

            <!-- Kelola Galeri -->
            <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-navy">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-navy flex items-center gap-2">
                        📸 Kelola Galeri Publik
                    </h3>
                    <span class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1 rounded-full"><span id="galleryCount">0</span> Foto</span>
                </div>
                
                <div id="adminGalleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Loading state -->
                    <p class="text-gray-500 text-sm col-span-full text-center py-4">Memuat data galeri...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAAVp8acGErJ2bLM9lbA1kG5NyDjT9Fi9k",
            authDomain: "twibbon-osi-2026-259e1.firebaseapp.com",
            projectId: "twibbon-osi-2026-259e1",
            storageBucket: "twibbon-osi-2026-259e1.firebasestorage.app",
            messagingSenderId: "958517476745",
            appId: "1:958517476745:web:29d8eab6e1d16349cb7558",
            measurementId: "G-QKY6N1JC1H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Cloudinary Configuration
        const CLOUD_NAME = 'n9qafiew';
        const UPLOAD_PRESET = 'h5j0pysw';

        // DOM Elements
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        
        const templateUpload = document.getElementById('templateUpload');
        const saveTemplateBtn = document.getElementById('saveTemplateBtn');
        const currentTemplatePreview = document.getElementById('currentTemplatePreview');
        const templateStatus = document.getElementById('templateStatus');
        
        const adminGalleryGrid = document.getElementById('adminGalleryGrid');
        const galleryCount = document.getElementById('galleryCount');

        // Authentication State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                dashboardSection.classList.add('flex');
                logoutBtn.classList.remove('hidden');
                
                // Load Admin Data
                loadCurrentTemplate();
                loadGallery();
            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
                dashboardSection.classList.remove('flex');
                logoutBtn.classList.add('hidden');
            }
        });

        // Login Logic
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('loginBtn');
            
            try {
                btn.innerText = "Loading...";
                btn.disabled = true;
                loginError.classList.add('hidden');
                
                await signInWithEmailAndPassword(auth, email, password);
                
            } catch (error) {
                loginError.innerText = "Login gagal: Email atau Password salah.";
                loginError.classList.remove('hidden');
            } finally {
                btn.innerText = "Login";
                btn.disabled = false;
            }
        });

        // Logout Logic
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // --- Template Management ---
        async function loadCurrentTemplate() {
            try {
                const docRef = doc(db, "settings", "twibbon");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().url) {
                    currentTemplatePreview.src = docSnap.data().url;
                }
            } catch (e) {
                console.error("Gagal memuat template:", e);
            }
        }

        saveTemplateBtn.addEventListener('click', async () => {
            const file = templateUpload.files[0];
            if (!file) {
                alert("Pilih file PNG terlebih dahulu!");
                return;
            }

            try {
                saveTemplateBtn.disabled = true;
                saveTemplateBtn.innerText = "Mengupload...";
                templateStatus.innerText = "Sedang mengunggah ke Cloudinary...";
                templateStatus.className = "text-sm mt-2 font-medium text-blue-500";

                // Upload to Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.secure_url) {
                    templateStatus.innerText = "Menyimpan pengaturan...";
                    // Save to Firestore
                    await setDoc(doc(db, "settings", "twibbon"), {
                        url: data.secure_url,
                        updatedAt: new Date()
                    });
                    
                    templateStatus.innerText = "Berhasil! Template twibbon telah diperbarui untuk semua orang.";
                    templateStatus.className = "text-sm mt-2 font-medium text-green-500";
                    currentTemplatePreview.src = data.secure_url;
                    templateUpload.value = "";
                } else {
                    throw new Error("Gagal mendapatkan URL gambar dari Cloudinary");
                }
            } catch (error) {
                console.error(error);
                templateStatus.innerText = "Gagal mengunggah template: " + error.message;
                templateStatus.className = "text-sm mt-2 font-medium text-red-500";
            } finally {
                saveTemplateBtn.disabled = false;
                saveTemplateBtn.innerText = "Upload & Simpan Perubahan";
            }
        });

        // --- Gallery Management ---
        async function loadGallery() {
            try {
                adminGalleryGrid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-4">Memuat data galeri...</p>';
                
                const q = query(collection(db, "gallery"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminGalleryGrid.innerHTML = '';
                galleryCount.innerText = querySnapshot.size;

                if (querySnapshot.empty) {
                    adminGalleryGrid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-4">Belum ada foto di galeri.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = "relative group bg-gray-100 rounded-lg overflow-hidden border border-gray-200 aspect-square";
                    
                    let optimizedUrl = data.url;
                    let playIcon = '';
                    
                    if (data.type === 'video') {
                        let baseVideoUrl = data.url.split('.').slice(0, -1).join('.');
                        optimizedUrl = baseVideoUrl.replace('/upload/', '/upload/w_300,q_auto,f_auto/') + '.jpg';
                        playIcon = '<div class="absolute top-2 left-2 bg-black/60 rounded px-2 py-1 text-white text-xs font-bold">🎬 Video</div>';
                    } else {
                        optimizedUrl = data.url.replace('/upload/', '/upload/w_300,q_auto,f_auto/');
                    }

                    div.innerHTML = `
                        <img src="${optimizedUrl}" class="w-full h-full object-cover" alt="Gallery Image">
                        ${playIcon}
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-2 gap-2">
                            <span class="text-white text-xs text-center line-clamp-2">${data.participantName || 'Anonim'}</span>
                            <button class="delete-btn bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1.5 px-3 rounded shadow" data-id="${docSnap.id}">Hapus</button>
                        </div>
                    `;
                    adminGalleryGrid.appendChild(div);
                });

                // Attach delete events
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm("Yakin ingin menghapus foto ini dari Galeri Publik? (Foto tidak akan terhapus dari device pengguna)")) {
                            try {
                                await deleteDoc(doc(db, "gallery", id));
                                e.target.closest('.group').remove();
                                galleryCount.innerText = parseInt(galleryCount.innerText) - 1;
                            } catch (err) {
                                alert("Gagal menghapus foto: " + err.message);
                            }
                        }
                    });
                });

            } catch (e) {
                console.error("Gagal memuat galeri:", e);
                adminGalleryGrid.innerHTML = '<p class="text-red-500 text-sm col-span-full text-center py-4">Gagal memuat galeri. Pastikan aturan Firebase mengizinkan akses.</p>';
            }
        }
    </script>
</body>
</html>
